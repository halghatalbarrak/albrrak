name: Hifz sessions count (read-only)

# قراءةٌ فقط: حصر سجلّات التسميع والإتقان في آخر أسبوعين.
# لا تغيير في البيانات — للتشخيص فقط.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  count:
    name: count hifz sessions (read-only)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Count hifz sessions (read-only)
        run: node scripts/ops/count-hifz-sessions.mjs
