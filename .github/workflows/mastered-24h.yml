name: جلسات الإتقان — آخر ٢٤ ساعة

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mastered-24h:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الاعتمادات
        run: npm ci

      - name: توليد عميل Prisma
        run: npx prisma generate

      - name: تشغيل سكربت الإتقان
        run: node scripts/ops/mastered-sessions-24h.mjs
