name: Diag DB

# تشخيص اتصال Prisma بوقت التشغيل (DATABASE_URL / 6543) — يدويًّا.
# يطبع الخطأ الحقيقي إن فشل، لنراه بدل التخمين.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    name: prisma runtime query
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Query via runtime pooler
        run: node scripts/diag-db.mjs
