name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: tsc + lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci يشغّل postinstall ⟵ prisma generate (يولّد أنواع @prisma/client).
      # لا يلزم DATABASE_URL هنا: generate/lint/build لا تتصل بالقاعدة.
      - name: Install dependencies
        run: npm ci

      # تخزين مؤقّت لمخرجات البناء — يُسرِّع الدورات اللاحقة ~40 ثانية.
      - name: Cache .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (next lint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build

      # بوّابة التوطين: تمنع ازدياد النصوص العربيّة الحرفيّة (throw + JSX) فوق السقف المحفوظ.
      - name: i18n literal gate
        run: node scripts/i18n-literals.mjs

  test:
    name: server rule tests (Postgres)
    runs-on: ubuntu-latest
    # قاعدة العمل ٤: كل قاعدة مطلقة لها اختبار يثبت الرفض في الخادم.
    # تُشغَّل على Postgres حقيقي بعد تطبيق الترحيلات.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: albrrak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/albrrak_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/albrrak_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to test DB
        run: npx prisma migrate deploy

      # أسرار عابرة لقاعدة الاختبار فقط — ليست إنتاجية.
      # NATIONAL_ID_ENC_KEY: تشفير الهوية. SUPABASE_JWT_SECRET: تحقّق JWT في اختبارات HTTP.
      - name: Run tests
        run: |
          export NATIONAL_ID_ENC_KEY="$(openssl rand -base64 32)"
          export SUPABASE_JWT_SECRET="$(openssl rand -base64 32)"
          npm test

  author-check:
    name: تحقّق من بريد المؤلف (thmny88 فقط)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: تأكّد أن كل commits في الـPR من thmny88@gmail.com
        run: |
          bad=$(git log origin/${{ github.base_ref }}..HEAD --format="%ae" \
            | grep -v "^thmny88@gmail\.com$" \
            | grep -v "^noreply@anthropic\.com$" \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::commits من بريد غير مصرَّح به:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "✅ كل commits من thmny88@gmail.com"

  prod-schema-sync:
    name: prod schema in sync (migrate status)
    # الكود يُنشَر تلقائيًّا، والمخطط ينتظر زرًّا بشريًّا (Migrate). بينهما فجوةٌ يعمل
    # فيها كودٌ جديد على قاعدةٍ قديمة (عطب P2022). هذه الوظيفة تُغلق الفجوة: تقرأ حالة
    # ترحيلات الإنتاج (بلا تطبيق)، وتفشل صراحةً إن كان الإنتاج متأخّرًا — فيستحيل الدمج
    # ونحن ناسون. مبدأ الحلقات: لا انتقال بلا اعتماد. (CI الأخرى تُرحّل قاعدةً عابرة،
    # فتخضرّ وهي عمياء عن الإنتاج — كعلّة SUPABASE_JWT_SECRET: خضرةٌ في الموضع الخطأ.)
    runs-on: ubuntu-latest
    env:
      # قاعدة الإنتاج — قراءةٌ فقط. DIRECT_URL اتصالٌ مباشر (منفذ الجلسة) للترحيلات.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: تحقّق أن الإنتاج طبّق كل الترحيلات (قراءة فقط — لا تطبيق)
        run: |
          set +e
          out="$(npx prisma migrate status 2>&1)"
          code=$?
          echo "$out"
          echo "──────────────────────────────────────────"
          if [ $code -eq 0 ] && printf '%s' "$out" | grep -q "up to date"; then
            echo "✅ الإنتاج متزامنٌ مع كل الترحيلات — الدمج آمن."
            exit 0
          fi
          echo "::error::ترحيلات معلّقة على الإنتاج — شغّل Migrate (confirm=APPLY) على فرعك قبل الدمج."
          echo "❌ ترحيلات معلّقة على الإنتاج (انظر أعلاه لأسمائها)."
          echo "   الترتيب الحاكم: شغّل workflow «Migrate (deploy)» أولًا، ثم ادمج."
          echo "   (الترحيلات إضافية؛ فالكود القديم يتجاهل الأعمدة الجديدة بأمان.)"
          exit 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    env:
      # متغيّرات مؤقّتة للبناء والتشغيل — الاختبارات تُزيَّف كل طلبات الشبكة (page.route).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/albrrak_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/albrrak_test
      NATIONAL_ID_ENC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      SUPABASE_JWT_SECRET: placeholder-for-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test
