name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: tsc + lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci يشغّل postinstall ⟵ prisma generate (يولّد أنواع @prisma/client).
      # لا يلزم DATABASE_URL هنا: generate/lint/build لا تتصل بالقاعدة.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (next lint)
        run: npm run lint

      - name: Build (next build)
        run: npm run build
