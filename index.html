<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة حلقات الشيخ محمد البراك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#B8860B; --gold-d:#9a7109; --olive:#4A4A3A; --cream:#FBF7EF;
  --green:#2E7D32; --green-l:#e3f1e4; --red:#C62828; --red-l:#fbe4e4;
  --amber:#E8A317; --amber-l:#fdf0d5; --blue:#3a6ea5; --blue-l:#e6eef7;
  --line:#e7e0d2; --white:#fff;
  --shadow:0 2px 14px rgba(74,74,58,.10); --shadow-lg:0 10px 40px rgba(74,74,58,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--cream);color:var(--olive);line-height:1.6;-webkit-font-smoothing:antialiased}
.quran{font-family:'Amiri',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}
/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:256px;background:var(--olive);color:#f3efe4;display:flex;flex-direction:column;position:fixed;inset-inline-start:0;top:0;bottom:0;z-index:40}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center;font-size:23px;margin-bottom:9px}
.brand h1{font-size:15.5px;font-weight:800;color:#fff}
.brand p{font-size:10.5px;opacity:.7;margin-top:2px}
/* role switcher */
.roleswitch{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.roleswitch label{font-size:10.5px;opacity:.6;font-weight:600;display:block;margin-bottom:5px}
.roleswitch select{width:100%;background:#3c3c30;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 11px;font-size:13.5px;font-weight:700}
.nav{padding:10px;flex:1;overflow:auto}
.nav .grp{font-size:10px;opacity:.45;font-weight:700;padding:10px 12px 5px;letter-spacing:.5px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:10px;color:#e9e3d5;font-size:14px;font-weight:500;text-align:start;transition:.15s;margin-bottom:2px;position:relative}
.nav button .ic{font-size:17px;width:22px;text-align:center}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.active{background:var(--gold);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(184,134,11,.4)}
.nav button .cnt{position:absolute;inset-inline-end:11px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav button.active .cnt{background:#fff;color:var(--gold-d)}
.sidebar .who{padding:13px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;display:flex;align-items:center;gap:9px}
.sidebar .who .dot{width:9px;height:9px;border-radius:50%;background:#7ec97e;box-shadow:0 0 0 3px rgba(126,201,126,.25)}
.main{flex:1;margin-inline-start:256px;min-width:0}
.topbar{background:var(--white);border-bottom:1px solid var(--line);padding:15px 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;gap:12px}
.topbar h2{font-size:19px;font-weight:800;color:var(--olive)}
.topbar .sub{font-size:12px;color:#8a8574;font-weight:500;margin-top:1px}
.topbar .right{display:flex;align-items:center;gap:12px}
.bell{position:relative;width:42px;height:42px;border-radius:11px;background:#f0ead9;color:var(--olive);font-size:19px;display:flex;align-items:center;justify-content:center}
.bell .cnt{position:absolute;top:-4px;inset-inline-start:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.offline{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;background:var(--green-l);color:var(--green);padding:7px 12px;border-radius:20px;white-space:nowrap}
.offline .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.content{padding:24px 30px 60px}
/* ===== Cards / KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px;margin-bottom:22px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;inset-inline-start:0;width:4px;height:100%;background:var(--gold)}
.kpi .v{font-size:26px;font-weight:800;color:var(--olive)}
.kpi .l{font-size:12px;color:#8a8574;font-weight:600;margin-top:3px}
.kpi .t{font-size:11px;margin-top:7px;font-weight:600}
.kpi.ok .t{color:var(--green)} .kpi.warn .t{color:var(--amber)}
.kpi.ok::before{background:var(--green)} .kpi.warn::before{background:var(--amber)} .kpi.bad::before{background:var(--red)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.panel-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-h h3{font-size:15.5px;font-weight:800}
.panel-h .hint{font-size:12px;color:#8a8574}
.panel-b{padding:18px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
/* buttons */
.btn{border-radius:11px;padding:11px 18px;font-weight:800;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn-p{background:var(--gold);color:#fff;box-shadow:0 4px 12px rgba(184,134,11,.3)} .btn-p:hover{background:var(--gold-d)}
.btn-g{background:#f0ead9;color:var(--olive)} .btn-g:hover{background:#e7dfca}
.btn-green{background:var(--green);color:#fff} .btn-red{background:var(--red);color:#fff}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:9px}
.btn-o{border:1.5px solid var(--gold);color:var(--gold-d);background:#fff}
/* circle picker */
.tabbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
.tabbar button{background:var(--white);border:1.5px solid var(--line);border-radius:11px;padding:10px 16px;font-weight:700;font-size:13.5px;color:var(--olive);transition:.15s;box-shadow:var(--shadow)}
.tabbar button.active{background:var(--olive);color:#fff;border-color:var(--olive)}
.tabbar button small{display:block;font-weight:500;font-size:10.5px;opacity:.7;margin-top:1px}
/* legend */
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:15px;font-size:12px;font-weight:600;color:#8a8574}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:5px;display:inline-block;border:1px solid rgba(0,0,0,.06)}
.sw.green{background:var(--green)} .sw.grad{background:linear-gradient(90deg,var(--green) 55%,#f0ead9 55%)}
.sw.red{background:var(--red)} .sw.empty{background:#fff;border:1.5px dashed #cfc7b4}
/* student grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:13px}
.scard{background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s;position:relative}
.scard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
.scard .status{position:absolute;top:12px;inset-inline-end:12px;width:14px;height:14px;border-radius:50%}
.st-green{background:var(--green)} .st-red{background:var(--red)} .st-empty{background:#fff;border:2px dashed #cfc7b4}
.st-grad{background:conic-gradient(var(--green) var(--p,50%),#eee6d4 0)}
.scard h4{font-size:15px;font-weight:700;margin-bottom:2px;padding-inline-end:20px}
.scard .meta{font-size:11px;color:#9a9482;margin-bottom:10px}
.bar{height:8px;background:#f0ead9;border-radius:5px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;border-radius:5px;transition:.5s}
.scard .prog{font-size:12px;font-weight:700;display:flex;justify-content:space-between}
.scard .pts{font-size:11px;color:var(--gold-d);font-weight:700;margin-top:7px;display:flex;align-items:center;gap:5px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(50,48,40,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--cream);border-radius:20px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-h{background:var(--olive);color:#fff;padding:17px 22px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:17px;font-weight:800}
.modal-h .x{color:#fff;font-size:26px;line-height:1;opacity:.8}.modal-h .x:hover{opacity:1}
.modal-h small{opacity:.75;font-size:12px}
.modal-b{padding:19px 22px}
.sec{margin-bottom:17px}
.sec .lbl{font-size:13px;font-weight:700;margin-bottom:9px;color:var(--olive);display:flex;align-items:center;gap:7px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 15px;font-weight:700;font-size:13.5px;color:var(--olive);transition:.12s}
.chip.on-present{background:var(--green);color:#fff;border-color:var(--green)}
.chip.on-late{background:var(--amber);color:#fff;border-color:var(--amber)}
.chip.on-exc{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.on-abs{background:#9a9482;color:#fff;border-color:#9a9482}
.ayahbox{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px 15px}
.ayahrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ayahrow .from{font-size:13px;color:#8a8574;font-weight:600}
.ayahrow .from b{color:var(--gold-d);font-size:15px}
.autochip{font-size:10.5px;background:var(--amber-l);color:#a06f00;padding:3px 8px;border-radius:8px;font-weight:700}
.stepper{display:flex;align-items:center;gap:0;margin-top:11px;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;width:fit-content}
.stepper button{width:42px;height:42px;font-size:22px;background:#f7f2e6;color:var(--gold-d);font-weight:700}
.stepper button:hover{background:#efe7d3}
.stepper .val{min-width:120px;text-align:center;font-weight:800;font-size:15px;padding:0 8px}
.stepper .val small{display:block;font-size:10.5px;color:#9a9482;font-weight:600}
.achieve{margin-top:13px;background:var(--green-l);border-radius:12px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;transition:.3s}
.achieve.part{background:var(--amber-l)} .achieve.none{background:var(--red-l)}
.achieve .big{font-size:25px;font-weight:800;color:var(--green)}
.achieve.part .big{color:#a06f00}.achieve.none .big{color:var(--red)}
.achieve .lbl2{font-size:12px;font-weight:600;color:#7a745f}
.errbtns{display:flex;gap:8px;flex-wrap:wrap}
.errbtn{flex:1;min-width:128px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px;text-align:center;transition:.12s}
.errbtn:hover{border-color:var(--gold);background:#fffdf7}
.errbtn .n{font-weight:800;font-size:14px}
.errbtn .r{font-size:11px;color:#9a9482;font-weight:600;margin-top:2px}
.errbtn .cnt{display:inline-block;min-width:22px;margin-top:6px;background:var(--olive);color:#fff;border-radius:8px;font-size:12px;font-weight:700;padding:2px 7px}
.err-lafzi{border-top:3px solid var(--red)} .err-adi{border-top:3px solid var(--amber)} .err-shak{border-top:3px solid var(--blue)}
.tasklist{margin-top:11px;display:flex;flex-direction:column;gap:7px}
.taskrow{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:600}
.taskrow .pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--olive);color:#fff}
.itqan{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 15px;cursor:pointer;transition:.12s}
.itqan.on{background:var(--green-l);border-color:var(--green)}
.itqan .box{width:24px;height:24px;border-radius:7px;border:2px solid #cfc7b4;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;transition:.12s}
.itqan.on .box{background:var(--green);border-color:var(--green)}
.itqan .t{font-size:13px;font-weight:700}.itqan .d{font-size:11px;color:#9a9482;font-weight:500}
.modal-f{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:#fff;border-radius:0 0 20px 20px}
.timer{font-size:12px;color:#9a9482;font-weight:700;display:flex;align-items:center;gap:6px}
.timer b{color:var(--gold-d)}
.btn-save{flex:1}
/* toast */
.toast{position:fixed;bottom:26px;inset-inline-start:50%;transform:translateX(50%) translateY(120px);background:var(--olive);color:#fff;padding:14px 24px;border-radius:14px;box-shadow:var(--shadow-lg);z-index:200;transition:.35s;display:flex;align-items:center;gap:12px;max-width:90vw}
.toast.show{transform:translateX(50%) translateY(0)}
.toast .em{font-size:23px}
.toast .tt{font-weight:800;font-size:14.5px}.toast .ts{font-size:12px;opacity:.85}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 12px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--olive);color:#fff;font-weight:700;font-size:12.5px}
tr:hover td{background:#faf6ec}
td.s{text-align:start}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.tag.g{background:var(--green-l);color:var(--green)}.tag.a{background:var(--amber-l);color:#a06f00}.tag.r{background:var(--red-l);color:var(--red)}.tag.b{background:var(--blue-l);color:var(--blue)}.tag.n{background:#eee;color:#777}
.selrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.selrow button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--olive)}
.selrow button.active{background:var(--gold);color:#fff;border-color:var(--gold)}
/* rings */
.ringwrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-around}
.ring{text-align:center}.ring svg{transform:rotate(-90deg)}
.ring .lab{font-size:13px;font-weight:700;margin-top:7px}.ring .sub2{font-size:11px;color:#9a9482;font-weight:600}
.note{background:#fffdf5;border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:12px;padding:13px 16px;font-size:12.5px;color:#7a745f;margin-bottom:18px}
.note b{color:var(--olive)}
/* list rows (waitlist, excuses, audit, notifications) */
.lrow{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#fff;margin-bottom:9px}
.lrow .av{width:42px;height:42px;border-radius:11px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lrow .info{flex:1;min-width:0}
.lrow .info .t{font-weight:700;font-size:14px}
.lrow .info .d{font-size:11.5px;color:#9a9482;margin-top:1px}
.lrow .acts{display:flex;gap:7px;flex-wrap:wrap}
/* market */
.market{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.mcard{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:16px;text-align:center;transition:.15s}
.mcard:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.mcard .ic{font-size:38px;margin-bottom:8px}
.mcard .n{font-weight:800;font-size:15px}
.mcard .stk{font-size:11px;color:#9a9482;margin:4px 0 10px}
.mcard .cost{font-weight:800;color:var(--gold-d);margin-bottom:10px;font-size:15px}
/* level bar */
.levbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.levbar .top{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:9px}
.levbar .track{height:12px;background:#f0ead9;border-radius:7px;overflow:hidden}
.levbar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--amber));border-radius:7px}
.badges{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.bdg{background:var(--green-l);color:var(--green);border-radius:11px;padding:8px 13px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.bdg.lock{background:#f0f0ec;color:#aaa}
/* QR */
.qrbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px}
.qr{width:150px;height:150px;background:#fff;border:2px solid var(--olive);border-radius:14px;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);padding:9px;gap:1px}
.qr i{background:var(--olive);border-radius:1px} .qr i.o{background:transparent}
/* kiosk */
.kiosk{background:linear-gradient(160deg,#3a3a2e,#26261d);border-radius:20px;padding:34px;color:#fff;text-align:center}
.kiosk h2{font-size:30px;color:var(--gold);margin-bottom:5px;font-weight:800}
.kiosk .verse{font-family:'Amiri';font-size:20px;opacity:.85;margin-bottom:26px}
.kiosk .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:760px){.kiosk .board{grid-template-columns:1fr}}
.kiosk .honor{background:rgba(255,255,255,.07);border:1px solid rgba(184,134,11,.4);border-radius:16px;padding:20px}
.kiosk .honor .ttl{color:var(--gold);font-weight:800;font-size:15px;margin-bottom:14px}
.kiosk .honor .nm{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.kiosk .honor .nm .rk{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#26261d;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;margin-inline-start:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;background:#fff}
.matrix td,.matrix th{font-size:12px}
.mobonly{display:none}
.hamb{width:40px;height:40px;border-radius:11px;background:#f0ead9;color:var(--olive);font-size:19px;align-items:center;justify-content:center}
@media(max-width:820px){
  .sidebar{inset-inline-start:-256px;transition:.25s} .sidebar.open{inset-inline-start:0}
  .main{margin-inline-start:0}.mobonly{display:inline-flex}
  .content{padding:16px 15px 50px}.topbar{padding:13px 15px}.grid2{grid-template-columns:1fr}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js" onerror="console.info('لا يوجد config.js — تعمل المنصة محلياً (Offline-first)')"></script>
<script src="js/db.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">☾</div>
      <h1>حلقات الشيخ محمد البراك</h1>
      <p>منصة إدارة الحلقات القرآنية والتحفيز والمتابعة الأسرية</p>
    </div>
    <div class="roleswitch">
      <label>الدخول بصفة (RBAC):</label>
      <select id="roleSel" onchange="switchRole(this.value)"></select>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="whoBox"><span class="dot"></span> <span id="whoName"></span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:13px">
        <button class="hamb mobonly" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div><h2 id="viewTitle"></h2><div class="sub" id="viewSub"></div></div>
      </div>
      <div class="right">

/* ============================================================
   1) التسميع اليومي (بوابة المعلم)
   ============================================================ */
function computeKPIs(c=activeCircle){
  const cs=circleStudents(c);
  const marked=cs.filter(x=>x.today.done);
  const present=cs.filter(x=>['green','grad','red'].includes(x.today.status));
  const full=cs.filter(x=>x.today.status==='green');
  return {attendPct:cs.length?Math.round(marked.length/cs.length*100):0,
    itqanPct:present.length?Math.round(full.length/present.length*100):0,
    present:present.length,total:cs.length,avgTime:12};
}
function renderTasmee(c){
  const k=computeKPIs(); const cs=circleStudents();
  c.innerHTML=`
  <div class="kpis">
    <div class="kpi ${k.attendPct>=95?'ok':'warn'}"><div class="v">${arNum(k.attendPct)}%</div><div class="l">اكتمال الحضور اليوم</div><div class="t">الهدف ≥ ٩٥٪</div></div>
    <div class="kpi ${k.itqanPct>=85?'ok':'warn'}"><div class="v">${arNum(k.itqanPct)}%</div><div class="l">دقّة الإتقان</div><div class="t">الهدف ≥ ٨٥٪</div></div>
    <div class="kpi ok"><div class="v">${arNum(k.avgTime)} ث</div><div class="l">متوسط زمن التسميع</div><div class="t">الهدف ≤ ١٥ ث</div></div>
    <div class="kpi"><div class="v">${arNum(k.present)}/${arNum(k.total)}</div><div class="l">الحاضرون</div><div class="t" style="color:#9a9482">تحديث لحظي</div></div>
  </div>
  <div class="tabbar">${CIRCLES.map(cc=>`<button class="${cc.id===activeCircle?'active':''}" onclick="activeCircle='${cc.id}';render()">${cc.name}<small>${cc.mosque} ، ${arNum(STUDENTS.filter(s=>s.circle===cc.id).length)} طلاب</small></button>`).join('')}</div>
  <div class="legend"><span><i class="sw green"></i> إنجاز كامل ١٠٠٪+</span><span><i class="sw grad"></i> إنجاز جزئي</span><span><i class="sw red"></i> حاضر بلا إنجاز</span><span><i class="sw empty"></i> غائب / لم يُرصد</span></div>
  <div class="grid">${cs.map(studentCard).join('')}</div>`;
}
function studentCard(st){
  const t=st.today;
  const pct=t.status==='green'?100:t.status==='grad'?achievePct(t.achievedLines,st.dailyTarget):0;
  return `<div class="scard" onclick="openTasmee(${st.id})">
    <span class="status ${statusClass(t.status)}" style="--p:${pct}%"></span>
    <h4>${st.name.split(' ').slice(0,2).join(' ')}</h4>
    <div class="meta">${SURAHS[st.lastStop.surah]} ، هدف اليوم ${arNum(st.dailyTarget)} أسطر</div>
    <div class="bar"><i style="width:${Math.min(100,pct)}%;background:${barColor(t.status)}"></i></div>
    <div class="prog"><span>${t.done?(t.status==='red'?'حاضر — بلا إنجاز':t.status==='empty'?'غائب':'أُنجز '+arNum(pct)+'٪'):'لم يُسمّع بعد'}</span></div>
    <div class="pts">◆ ${arNum(st.points)} نقطة${st.streak>=7?' ، 🔥 مواظبة':''}</div></div>`;
}

  const achState=(cur.status==='red'||lines===0)?'none':pct>=100?'':'part';

        <button class="chip ${cur.status==='exc'?'on-exc':''}" onclick="setStatus('exc')">📄 مستأذن</button>
        <button class="chip ${cur.status==='abs'?'on-abs':''}" onclick="setStatus('abs')">✕ غائب</button>
      </div></div>
    <div class="sec"><div class="lbl">٢ ، المقرر — تحديد آية البدء بالتوقّف السابق</div>
      <div class="ayahbox">
        <div class="ayahrow"><div class="from">من <b class="quran">﴿${SURAHS[st.lastStop.surah]} : ${arNum(cur.startAyah)}﴾</b> <span class="autochip">↺ تلقائي من آخر توقّف</span></div>
          <div class="from">هدف اليوم: <b>${arNum(st.dailyTarget)}</b> أسطر</div></div>
        <div class="stepper"><button onclick="stepStop(-1)">−</button><div class="val">آية التوقّف: ${arNum(cur.stopAyah)}<small>${arNum(lines)} سطر مُسمّع</small></div><button onclick="stepStop(1)">+</button></div>

    </div>
    <div class="sec"><div class="lbl">٣ ، تسجيل الأخطاء وتصنيفها <span style="font-weight:500;color:#9a9482;font-size:11px">(يربط تكراراً إلزامياً — SRS 7.3)</span></div>
      <div class="errbtns">${Object.entries(ERR).map(([k,e])=>`<button class="errbtn ${e.cls}" onclick="addErr('${k}')"><div class="n">${e.label}</div><div class="r">${arNum(e.reps)} تكرار إلزامي</div><div class="cnt">${arNum(cur.mistakes[k])}</div></button>`).join('')}</div>
      ${tot>0?`<div class="tasklist">${Object.entries(cur.mistakes).filter(([k,v])=>v>0).map(([k,v])=>`<div class="taskrow"><span>مهمة تكرار — ${ERR[k].label} ×${arNum(v)}</span><span class="pill">${arNum(v*ERR[k].reps)} تكرار إجمالي</span></div>`).join('')}</div>`:''}
    </div>
    <div class="sec"><div class="lbl">٤ ، خمسة الإتقان <span style="font-weight:500;color:#9a9482;font-size:11px">(SRS 7.4)</span></div>
      <div class="itqan ${cur.itqan?'on':''}" onclick="toggleItqan()"><div class="box">${cur.itqan?'✓':''}</div>
        <div><div class="t">اعتماد الحفظ — أول ٥ تكرارات بلا خطأ ولا شكّ</div><div class="d">${tot>0?'⚠ يوجد خطأ/شكّ ضمن الخمسة → يُصفَّر العدّاد':'جاهز للاعتماد (+'+arNum(POINTS.itqanPerPage)+' نقطة إتقان)'}</div></div></div>
    </div>
  </div>
  <div class="modal-f"><div class="timer">⏱ زمن الإدخال: <b id="tmr">٠ ث</b></div>
    <button class="btn btn-g" onclick="closeModal()">إلغاء</button><button class="btn btn-p btn-save" onclick="saveTasmee()">حفظ التسميع ◂</button></div>`;
  clearInterval(tmrInt);
  tmrInt=setInterval(()=>{const el=$('#tmr');if(!el||!cur){clearInterval(tmrInt);return;}el.textContent=arNum(Math.round((Date.now()-cur.openedAt)/1000))+' ث';},1000);
}
function redraw(){const o=cur.openedAt;drawModal();cur.openedAt=o;}
function setStatus(s){cur.status=s==='present'?'green':s;redraw();}
function stepStop(d){cur.stopAyah=Math.max(cur.startAyah-1,cur.stopAyah+d);
  const l=Math.max(0,cur.stopAyah-cur.startAyah+1),p=achievePct(l,cur.student.dailyTarget);
  if(!['abs','exc'].includes(cur.status))cur.status=p>=100?'green':p>0?'grad':'red';redraw();}
function addErr(k){cur.mistakes[k]++;if(cur.itqan)cur.itqan=false;redraw();}
function toggleItqan(){const t=cur.mistakes.lafzi+cur.mistakes.adi+cur.mistakes.shak;
  if(t>0){toast('⚠','لا يصح الاعتماد','يوجد خطأ أو شكّ ضمن خمسة الإتقان — يُصفَّر العدّاد');return;}cur.itqan=!cur.itqan;redraw();}
function saveTasmee(){
  const st=cur.student,t=st.today,lines=Math.max(0,cur.stopAyah-cur.startAyah+1),pct=achievePct(lines,st.dailyTarget);
  const secs=Math.round((Date.now()-cur.openedAt)/1000);
  if(cur.status==='abs'||cur.status==='exc'){t.status='empty';t.done=true;t.achievedLines=0;}
  else{t.status=pct>=100?'green':pct>0?'grad':'red';t.achievedLines=lines;t.late=cur.status==='late';t.done=true;if(lines>0)st.lastStop.ayah=cur.stopAyah+1;}
  t.mistakes={...cur.mistakes};t.itqan=cur.itqan;
  let earned=0;const dt=[];
  if(['green','grad','red'].includes(t.status)&&cur.status!=='late'){earned+=POINTS.present;dt.push('حضور في وقته +'+POINTS.present);}
  if(t.status==='green'){earned+=POINTS.dailyTarget;dt.push('الهدف اليومي +'+POINTS.dailyTarget);}
  if(cur.itqan){earned+=POINTS.itqanPerPage;dt.push('إتقان +'+POINTS.itqanPerPage);}
  if(earned>POINTS.dailyCap){earned=POINTS.dailyCap;dt.push('(سقف يومي '+POINTS.dailyCap+')');}
  st.points+=earned; if(t.status==='green')st.streak++;
  DB.saveSession({studentId:st.id,points:st.points,streak:st.streak,lastStopAyah:st.lastStop.ayah,
    startAyah:cur.startAyah,stopAyah:cur.stopAyah,lines,attendance:cur.status,itqan:t.itqan,
    performance:t.itqan?'itqan':t.status==='green'?'jayyid':'needs_review',mistakes:t.mistakes,earned,reason:dt.join('، ')});
  logAudit('أ. عبدالرحمن','رصد حضور وإنجاز — '+st.name.split(' ').slice(0,2).join(' '));
  if(t.status==='red'){NOTIFS.unshift({id:'n'+Date.now(),ev:'حاضر بلا إنجاز — '+st.name.split(' ')[0],to:'ولي الأمر',ch:'تطبيق + رسالة',when:'فور إغلاق الجلسة',time:'الآن',read:false,kind:'r'});}
  const em=t.status==='green'?'🌿':t.status==='red'?'💛':'📖';
  const head=t.status==='green'?'تقبّل الله — إنجازٌ كامل':t.status==='red'?'حاضرٌ نحتسبه — نتابع':t.status==='empty'?'سُجّل الغياب/العذر':'أُنجز جزءٌ من المقرر';
  const sub=`زمن الإدخال ${arNum(secs)} ث`+(earned>0?` ، +${arNum(earned)} نقطة (${dt.join('، ')})`:'');
  closeModal(); buildNav(); render(); toast(em,head,sub);
}

  return{attend:Math.round(marked.length/all.length*100),
    itqan:present.length?Math.round(full.length/present.length*100):0,
    struggling:all.filter(x=>x.today.status==='red').length,
    present:present.length,total:all.length,
    points:all.reduce((a,b)=>a+b.points,0)};
}

function renderMarket(c){
  const st=STUDENTS.find(x=>x.id===marketStudent);
  c.innerHTML=`
  <div class="note"><b>الجوائز عينية:</b> النقاط تُصرف في جوائز حقيقية لا تُشترى بالمال. الاستبدال يُسجَّل ويُخصم الرصيد، ويُبنى كل صرف على حدثٍ نظامي موثّق (SRS 9.4).</div>
  <div class="selrow">${STUDENTS.map(x=>`<button class="${x.id===marketStudent?'active':''}" onclick="marketStudent=${x.id};render()">${x.name.split(' ').slice(0,2).join(' ')}</button>`).join('')}</div>
  <div class="levbar"><div class="top"><span>رصيد ${st.name.split(' ').slice(0,2).join(' ')}</span><span style="color:var(--gold-d)">◆ ${arNum(st.points)} نقطة</span></div>
    <div class="track"><i style="width:${Math.min(100,st.points/10)}%"></i></div></div>
  <div class="market">${REWARDS.map(r=>`<div class="mcard"><div class="ic">${r.ic}</div><div class="n">${r.name}</div><div class="stk">متوفّر: ${arNum(r.stock)}</div><div class="cost">◆ ${arNum(r.cost)}</div>
    <button class="btn ${st.points>=r.cost&&r.stock>0?'btn-p':'btn-g'} btn-sm" style="width:100%" ${st.points>=r.cost&&r.stock>0?'':'disabled'} onclick="redeem('${r.id}')">${r.stock<=0?'نفد':st.points>=r.cost?'استبدال':'نقاط غير كافية'}</button></div>`).join('')}</div>`;
}
function redeem(id){
  const r=REWARDS.find(x=>x.id===id),st=STUDENTS.find(x=>x.id===marketStudent);
  if(st.points<r.cost||r.stock<=0)return;
  st.points-=r.cost;r.stock--;
  DB.updateReward(r.id,r.stock); DB.updateStudentPoints(st.id,st.points);
  logAudit('سوق الحلقة','استبدال «'+r.name+'» ('+r.cost+' نقطة) — '+st.name.split(' ')[0]);
  render();toast(r.ic,'تم الاستبدال',r.name+' — خُصم ◆ '+arNum(r.cost)+' وسُجّل التسليم');
}

function apprList(){return APPROVALS.filter(a=>a.status==='pending').length?APPROVALS.filter(a=>a.status==='pending').map(a=>`<div class="lrow"><div class="av">✅</div><div class="info"><div class="t">${a.title}</div><div class="d">${a.date!=='—'?'التاريخ: '+a.date:'بانتظار موافقتك'}</div></div><div class="acts"><button class="btn btn-green btn-sm" onclick="approve('${a.id}',1)">موافقة</button><button class="btn btn-g btn-sm" onclick="approve('${a.id}',0)">رفض</button></div></div>`).join(''):'<div style="text-align:center;color:#9a9482;padding:16px">لا موافقات معلّقة</div>';}
function approve(id,ok){const a=APPROVALS.find(x=>x.id===id);a.status=ok?'approved':'rejected';
  $('#apprList').innerHTML=apprList();toast(ok?'✅':'✖',ok?'تمت الموافقة':'سُجّل الرفض',a.title);}
function payFee(){PAYMENTS.unshift({id:'p'+Date.now(),payer:'أبو محمد الغامدي',amount:300,kind:'رسوم',target:'—',status:'ناجحة',date:'الآن'});
  DB.addPayment({payer:'أبو محمد الغامدي',amount:300,kind:'fees',target:'—',status:'success'});
  logAudit('البوابة المالية','دفع رسوم ٣٠٠ ﷼ — أبو محمد');toast('💳','دفعٌ آمن ناجح','إيصال إلكتروني — مدعوم Apple Pay/STC Pay');}
function donate(){PAYMENTS.unshift({id:'p'+Date.now(),payer:'أبو محمد الغامدي',amount:500,kind:'تبرّع',target:'دعم طالب',status:'ناجحة',date:'الآن'});

/* ---------- Toast ---------- */
let toastT=null;
function toast(em,tt,ts){const el=$('#toast');el.innerHTML=`<span class="em">${em}</span><div><div class="tt">${tt}</div><div class="ts">${ts||''}</div></div>`;
  el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3800);}

/* ---------- ربط بيانات Supabase (مع سقوط تلقائي للبذور المحلية) ---------- */
function applyRemote(d){
  if(d.circles&&d.circles.length){CIRCLES.length=0;d.circles.forEach(c=>CIRCLES.push({id:c.id,name:c.name,teacher:c.teacher,mosque:c.mosque}));}
  if(d.guardians&&d.guardians.length){Object.keys(GUARDIANS).forEach(k=>delete GUARDIANS[k]);d.guardians.forEach(g=>GUARDIANS[g.id]={name:g.name,phone:g.phone});}
  if(d.students&&d.students.length){STUDENTS.length=0;d.students.forEach(s=>STUDENTS.push({
    id:s.id,name:s.full_name,circle:s.circle_id,age:s.age,guardian:s.guardian_id,program:s.program||'معارج',
    lastStop:{surah:s.last_stop_surah||2,ayah:s.last_stop_ayah||1},dailyTarget:s.daily_target||8,
    points:s.points||0,streak:s.streak||0,
    today:{status:null,achievedLines:null,mistakes:{lafzi:0,adi:0,shak:0},itqan:false,done:false,late:false}}));}
  if(d.waitlist){WAITLIST.length=0;d.waitlist.filter(w=>w.status==='pending').forEach(w=>WAITLIST.push({id:String(w.id),name:w.full_name,age:w.age,phone:w.phone,date:'—',status:'pending'}));}
  if(d.payments&&d.payments.length){PAYMENTS.length=0;d.payments.forEach(p=>PAYMENTS.push({id:String(p.id),payer:p.payer,amount:Number(p.amount),kind:p.kind==='fees'?'رسوم':p.kind==='donation'?'تبرّع':'جائزة',target:p.target||'—',status:p.status==='success'?'ناجحة':p.status==='refunded'?'مستردّة':'فاشلة',date:'—'}));}
  if(d.rewards&&d.rewards.length){REWARDS.length=0;d.rewards.forEach(r=>REWARDS.push({id:r.id,name:r.name,cost:r.cost,stock:r.stock,ic:r.icon}));}
  if(d.harvest&&d.harvest.length){HARVEST.length=0;d.harvest.forEach(h=>{const st=STUDENTS.find(x=>x.id===h.student_id);HARVEST.push({id:String(h.id),student:st?st.name:'طالب',parts:h.parts,scope:h.scope,status:h.status==='pending'?'بانتظار':h.status==='passed'?'اجتاز':'إعادة',note:h.note||''});});}
  if(d.audit&&d.audit.length){AUDIT.length=0;d.audit.forEach(a=>AUDIT.push({who:a.actor,act:a.action,time:'—'}));}
}
/* ============================================================
   المصادقة — حسابٌ مستقل لكل مستخدم (جوال + كلمة سر)
   ============================================================ */
let CURRENT_USER=null;
const ROLE_LABELS={general:'مشرف عام',teacher:'معلم حلقة',admin:'إداري',examiner:'مُسمِّع',parent:'ولي أمر',student:'طالب',sponsor:'داعم'};

function showLogin(mode){
  mode=mode||'in'; const signup=mode==='up';
  let el=document.getElementById('authGate');
  if(!el){ el=document.createElement('div'); el.id='authGate'; document.body.appendChild(el); }
  el.setAttribute('style','position:fixed;inset:0;z-index:500;background:linear-gradient(160deg,#4A4A3A,#26261d);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto');
  el.innerHTML=`
   <div style="background:#FBF7EF;border-radius:22px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden">
     <div style="background:linear-gradient(135deg,#B8860B,#9a7109);color:#fff;padding:26px;text-align:center">
       <div style="font-size:40px;line-height:1">☾</div>
       <h1 style="font-size:19px;font-weight:800;margin-top:8px">حلقات الشيخ محمد البراك</h1>
       <p style="font-size:12px;opacity:.85;margin-top:3px">${signup?'إنشاء حساب جديد':'تسجيل الدخول'}</p>
     </div>
     <div style="padding:22px">
       ${signup?`<div class="field"><label>الاسم الكامل</label><input id="auName" placeholder="مثال: عبدالله الغامدي"></div>`:''}
       <div class="field"><label>رقم الجوال</label><input id="auPhone" inputmode="numeric" placeholder="05xxxxxxxx"></div>
       <div class="field"><label>كلمة السر</label><input id="auPass" type="password" placeholder="٦ أحرف فأكثر"></div>
       ${signup?`<div class="field"><label>الصفة</label><select id="auRole">
          <option value="parent">ولي أمر</option><option value="teacher">معلم حلقة</option>
          <option value="student">طالب</option><option value="examiner">مُسمِّع</option>
          <option value="admin">إداري</option><option value="sponsor">داعم / كافل</option>
          <option value="general">مشرف عام</option></select></div>`:''}
       <div id="auErr" style="color:#C62828;font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:6px"></div>
       <button class="btn btn-p" style="width:100%" onclick="${signup?'doSignup()':'doLogin()'}">${signup?'إنشاء الحساب والدخول':'دخول'}</button>
       <div style="text-align:center;margin-top:14px;font-size:12.5px;color:#7a745f">
         ${signup?'لديك حساب؟ ':'ليس لديك حساب؟ '}
         <a onclick="showLogin('${signup?'in':'up'}')" style="color:#9a7109;font-weight:800;cursor:pointer">${signup?'سجّل الدخول':'أنشئ حساباً'}</a>
       </div>
     </div>
   </div>`;
  el.style.display='flex';
}
function authErr(m){ const e=document.getElementById('auErr'); if(e) e.textContent=m; }
function hideLogin(){ const el=document.getElementById('authGate'); if(el) el.remove(); }

async function doLogin(){
  const phone=(document.getElementById('auPhone').value||'').trim();
  const pass=document.getElementById('auPass').value||'';
  if(phone.replace(/\D/g,'').length<9) return authErr('أدخل رقم جوال صحيح');
  if(pass.length<6) return authErr('كلمة السر ٦ أحرف فأكثر');
  authErr('جارٍ الدخول…');
  const {error}=await DB.signIn({phone,password:pass});
  if(error) return authErr('تعذّر الدخول — تحقّق من الجوال وكلمة السر');
  await afterAuth();
}
async function doSignup(){
  const name=(document.getElementById('auName').value||'').trim();
  const phone=(document.getElementById('auPhone').value||'').trim();
  const pass=document.getElementById('auPass').value||'';
  const role=document.getElementById('auRole').value;
  if(!name) return authErr('أدخل الاسم');
  if(phone.replace(/\D/g,'').length<9) return authErr('أدخل رقم جوال صحيح');
  if(pass.length<6) return authErr('كلمة السر ٦ أحرف فأكثر');
  authErr('جارٍ إنشاء الحساب…');
  const {error,needsConfirm}=await DB.signUp({phone,password:pass,name,role});
  if(error){
    if(String(error.message).includes('registered')) return authErr('هذا الجوال مسجّل — سجّل الدخول');
    return authErr('تعذّر الإنشاء: '+error.message);
  }
  if(needsConfirm) return authErr('أُنشئ الحساب. فعّل «تعطيل تأكيد البريد» في Supabase ثم سجّل الدخول.');
  await afterAuth();
}
async function doLogout(){ await DB.signOut(); location.reload(); }

function applyProfileRole(p){
  if(p&&p.role&&ROLES[p.role]) ROLE=p.role;
  const rs=document.querySelector('.roleswitch'); if(rs) rs.style.display='none';
  const who=document.getElementById('whoBox');
  who.style.gap='8px';
  who.innerHTML=`<span class="dot"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(p&&p.full_name)||'مستخدم'} — ${ROLE_LABELS[ROLE]||''}</span><button onclick="doLogout()" style="background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:6px 11px;font-size:11px;font-weight:700;flex-shrink:0">خروج ⏻</button>`;
}
async function loadData(){
  const data=await DB.loadAll(); if(data) applyRemote(data);
  const badge=document.querySelector('.offline');
  if(DB.isOnline()) badge.innerHTML='<span class="dot"></span> متصل بقاعدة البيانات';
}
async function afterAuth(){
  const session=await DB.getSession();
  const profile=session?await DB.getProfile(session.user.id):null;
  CURRENT_USER=profile;
  hideLogin();
  await loadData();
  applyProfileRole(profile);
  buildRoleSelect(); buildNav(); render();
}

async function boot(){
  const ok=DB.init();
  if(!ok){ /* لا اتصال بقاعدة البيانات — وضع عرض تجريبي بلا تسجيل دخول */
    buildRoleSelect(); buildNav(); render(); return;
  }
  const session=await DB.getSession();
  if(!session){ showLogin('in'); return; }
  const profile=await DB.getProfile(session.user.id);
  CURRENT_USER=profile;
  await loadData();
  applyProfileRole(profile);
  buildRoleSelect(); buildNav(); render();
}
boot();
</script>
