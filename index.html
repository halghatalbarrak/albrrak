<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>منصة حلقات الشيخ محمد البراك — إدارة الحلقات القرآنية</title>
<meta name="description" content="منصة رقمية لإدارة حلقات تحفيظ القرآن الكريم: التسميع اليومي، متابعة الحفظ والإتقان، التحفيز بالنقاط، والمتابعة الأسرية. تعمل دون اتصال.">
<meta name="theme-color" content="#333829">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">

<!-- الهوية والأيقونات -->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حلقات البراك">

<!-- مشاركة اجتماعية -->
<meta property="og:type" content="website">
<meta property="og:title" content="منصة حلقات الشيخ محمد البراك">
<meta property="og:description" content="إدارة الحلقات القرآنية والتحفيز والمتابعة الأسرية.">
<meta property="og:locale" content="ar_SA">

<!-- الخطوط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<!-- نظام التصميم -->
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">☾</div>
      <h1>حلقات الشيخ محمد البراك</h1>
      <p>منصة إدارة الحلقات القرآنية والتحفيز والمتابعة الأسرية</p>
    </div>
    <div class="roleswitch">
      <label>الدخول بصفة (RBAC):</label>
      <select id="roleSel" onchange="switchRole(this.value)" aria-label="اختيار الصفة"></select>
    </div>
    <nav class="nav" id="nav" aria-label="التنقّل الرئيسي"></nav>
    <div class="who" id="whoBox"><span class="dot"></span> <span id="whoName"></span></div>
  </aside>
  <div class="scrim" onclick="document.getElementById('sidebar').classList.remove('open')" aria-hidden="true"></div>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:13px">
        <button class="hamb mobonly" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="القائمة">☰</button>
        <div><h2 id="viewTitle"></h2><div class="sub" id="viewSub"></div></div>
      </div>
      <div class="right">
        <button class="bell" onclick="switchTo('notif')" title="الإشعارات" aria-label="الإشعارات">🔔<span class="cnt" id="bellCnt"></span></button>
        <div class="offline" role="status"><span class="dot"></span> يعمل دون اتصال</div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <div style="max-width:520px;margin:60px auto;padding:28px;font-family:sans-serif;text-align:center;background:#fff;border-radius:16px">
    تتطلب هذه المنصة تفعيل JavaScript في المتصفّح لعملها.
  </div>
</noscript>

<!-- Supabase SDK (مثبّت على إصدار دقيق؛ jsDelivr يقدّم حزمة المتصفّح UMD تلقائياً) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<!-- إعدادات الاتصال (المفتاح العام آمن للنشر؛ الحماية عبر RLS) -->
<script src="js/config.js" onerror="console.info('لا يوجد config.js — تعمل المنصة محلياً (Offline-first)')"></script>
<!-- طبقة البيانات والمصادقة -->
<script src="js/db.js"></script>
<!-- التطبيق -->
<script src="js/app.js"></script>
<!-- تسجيل Service Worker للعمل دون اتصال -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((e) => console.info('SW skipped:', e.message));
    });
  }
</script>
</body>
</html>
